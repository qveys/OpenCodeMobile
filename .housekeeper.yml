# Housekeeper GitHub App: per-repository handler configuration.
# An absent or unparseable file means every handler is disabled.
# Default branch is main (the app's default), so no baseBranch overrides.
handlers:
  pr-review:
    enabled: true
    checkPolicy: informational
  pr-comments-resolver:
    enabled: true
  conflict-resolve:
    enabled: true
  normalize-title:
    enabled: true
  secret-scan:
    enabled: true
  require-up-to-date:
    enabled: true
  pr-comment:
    enabled: true
  sync-labels:
    enabled: true
  # OpenCodeMobile has no CODEOWNERS / PR template / security policy yet, so
  # check the governance files that do exist instead of the handler defaults
  # (which would fail every PR until those files exist).
  required-checks:
    enabled: true
    requiredFiles:
      - README.md
      - ROADMAP.md
      - LICENSE
