# XcodeGen spec for the iOS host (ADR 0001 §4, OPE-169).
#
# `iosApp/` is a native Xcode project, not a Gradle module (see iosApp/README.md).
# This spec is the source of truth for that project; the generated
# `iosApp.xcodeproj` is disposable and can be regenerated at any time with:
#
#   cd iosApp && xcodegen generate
#
# The app target links the per-module Kotlin/Native **static** frameworks
# directly — there is no umbrella framework (ADR 0001 §3). The "Build Kotlin
# frameworks" pre-build phase runs before Swift compilation and stages them in
# `iosApp/build/frameworks`, which is where FRAMEWORK_SEARCH_PATHS points.
#
# Only the framework-producing modules the app actually reaches are listed:
#   iosAppHost -> featuresConnection -> designSystem
#             -> sharedDomain, sharedApplication, sharedSecurity
# (shared/networking and shared/tls-test-support declare no framework binary and
# are compiled into the frameworks that depend on them.)
name: iosApp

options:
  bundleIdPrefix: org.opencodemobile
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # The framework-staging run-script phase writes into iosApp/build/, which is
    # outside Xcode's script sandbox; disable the sandbox so it may do so.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "Info.plist"
          # OPE-198: the D8 cache write composition is not reached from the
          # :iosAppHost-only Xcode target (it imports sharedData/sharedApplication,
          # which are not linked directly — see OTHER_LDFLAGS). The merged head
          # keeps the file; OPE-176 re-wires it once the connection root binds
          # the realtime source.
          - "CacheComposition.swift"
    settings:
      base:
        PRODUCT_NAME: iosApp
        PRODUCT_BUNDLE_IDENTIFIER: org.opencodemobile.ios
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # The static Kotlin/Native framework staged by
        # scripts/ios/build-frameworks.sh just before the link phase.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/build/frameworks"
        # Only the composition root is linked: a Kotlin/Native static framework
        # embeds the Kotlin runtime and all transitive dependency code, so
        # linking several per-module frameworks injects the runtime more than
        # once and aborts at `+[KotlinBase load]`. `iosAppHost.framework`
        # already carries featuresConnection, designSystem and the shared
        # frameworks. The UI test bundle does not link it (it drives the app
        # through XCUIApplication).
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "iosAppHost"
    preBuildScripts:
      - name: "Build Kotlin frameworks"
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        # Explicit `bash` so the phase does not depend on the executable bit
        # (the repository's signed-commit flow cannot carry file modes).
        script: |
          set -euo pipefail
          bash "$SRCROOT/../scripts/ios/build-frameworks.sh"
    postBuildScripts:
      # OPE-274: the app links a single *static* framework, so Xcode does not
      # embed the framework's Compose resources. Compose Multiplatform reads
      # them from the main bundle at `compose-resources/composeResources/`;
      # without this copy the first `stringResource(...)` on iOS aborts at
      # runtime. Prefer the resources already packed in the framework, and fall
      # back to the Gradle processed-resources staging when the static framework
      # does not carry them.
      - name: "Copy Compose resources"
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          ROOT="$SRCROOT/.."
          BUNDLE="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/compose-resources"
          DEST="$BUNDLE/composeResources"
          rm -rf "$BUNDLE"
          mkdir -p "$DEST"

          staged=0
          FW="$SRCROOT/build/frameworks/iosAppHost.framework"
          if [ -d "$FW" ]; then
            while IFS= read -r d; do
              cp -R "$d"/. "$DEST"/ 2>/dev/null || true
              staged=1
            done < <(find "$FW" -type d -name 'composeResources' 2>/dev/null)
          fi

          if [ "$staged" -eq 0 ]; then
            while IFS= read -r d; do
              cp -R "$d"/. "$DEST"/ 2>/dev/null || true
              staged=1
            done < <(find "$ROOT" -maxdepth 5 -type d -path '*/build/processedResources/*/main/composeResources' 2>/dev/null)
          fi

          if [ "$staged" -eq 0 ]; then
            echo "::warning::no Compose resources found to stage; string resources may fail at runtime"
            exit 0
          fi
          echo "Staged Compose resources at $BUNDLE"
          ls "$DEST"

  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opencodemobile.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: iosApp

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
    test:
      targets:
        - iosAppUITests
      gatherCoverageData: false
