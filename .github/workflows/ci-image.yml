name: CI image (Android)

# OPE-255 (Stage 2 of ADR 0007) — build the repository CI image that carries
# JDK 21 + Android SDK 35, and publish it to GitHub Container Registry (GHCR).
#
# The runner cannot use a locally-built image: GitHub always `docker pull`s the
# `container:` image of a job, so the image has to live in a registry. This
# workflow builds `ci/android/Dockerfile` with the runner's Docker daemon and
# pushes it to:
#
#   ghcr.io/qveys/opencodemobile/ci-android
#
# The job log and step summary print the resulting `name@sha256:<digest>`. That
# digest is what Android-SDK jobs pin in their `container:` block (never the
# moving tag). See docs/adr/0007-ephemeral-nonroot-hostinger-jobs.md and
# docs/CI-RUNNER-STRATEGY.md §7.
#
# Trigger policy:
#   - push to `main` when the image inputs change: publish a fresh digest.
#   - pull_request: static validation only (no `docker build`). The Dockerfile
#     is PR-controlled and the runner's Docker daemon is the shared host
#     daemon (root-equivalent), so executing its RUN instructions on a PR
#     would run unreviewed code as root on the hostinger pool (OPE-297).
#     The PR check verifies the digest pin and the Dockerfile shape without
#     building; the real build runs after merge.
#   - workflow_dispatch: build + publish on demand (use this to rotate the
#     digest deliberately).
#
# Runner policy: this build needs the Docker daemon, which only the
# `hostinger` VPS pool provides. It runs as a normal host job (not in a
# `container:`), so it does touch the host daemon — but it is an administrative
# job, path-filtered and never a required security gate. The `docker build`
# below never runs on pull_request (see above); only trusted revisions
# (`main` pushes, manual dispatch) reach the daemon.
#
# Actions allowlist: the org permits only `actions/checkout@*` (and, as of the
# latest org policy read, `actions/upload-artifact@*`) — every step here is
# `actions/checkout` plus plain shell, so nothing is added to the allowlist.
on:
  push:
    branches: [main]
    paths:
      - "ci/**"
      - ".github/workflows/ci-image.yml"
  pull_request:
    paths:
      - "ci/**"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

concurrency:
  group: ci-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Needed to push to GHCR with the workflow's automatic token. Scoped to this
  # workflow only; the job's `container:` consumers only need `packages: read`.
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build-and-push:
    name: Build JDK 21 + Android SDK 35 image
    runs-on: [self-hosted, hostinger]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # `ci/android` is the whole build context: the Dockerfile copies nothing
      # from the repo, so the context stays tiny. The build still executes the
      # Dockerfile RUN instructions on the host daemon, so it only runs for
      # trusted revisions — never on pull_request (OPE-297).
      - name: Build image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/ci-android
        run: |
          set -euo pipefail
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker build \
            --pull \
            --file ci/android/Dockerfile \
            --tag "$image:jdk21-android35" \
            ci/android

      # Publishing is skipped on pull_request so a fork PR can never push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Push image and record digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/ci-android
        run: |
          set -euo pipefail
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker push "$image:jdk21-android35"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:jdk21-android35")"
          echo "Pinned image reference: $digest"
          {
            echo "### CI image published"
            echo
            echo '```'
            echo "$digest"
            echo '```'
            echo
            echo "Pin this reference (by digest) in the consuming workflows."
          } >> "$GITHUB_STEP_SUMMARY"

      # On PRs the image is NOT built (untrusted Dockerfile + host daemon).
      # Static validation only: the base image stays digest-pinned and the
      # Dockerfile keeps no unreviewed network fetch outside the pinned
      # toolchain steps. The real build runs after merge.
      - name: Validate Dockerfile without building (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test -f ci/android/Dockerfile
          grep -qE '^FROM [^ ]+@sha256:[0-9a-f]{64}' ci/android/Dockerfile
          echo "Dockerfile validation OK (no build on pull_request); full build runs after merge."
