name: Lint

# OPE-15 — required `lint` gate. Runs on every push to `main` and every PR to
# `main`, and fails the build on any detekt finding.
#
# The gate itself is configured by OPE-14: `config/detekt/detekt.yml` holds the
# bug-focused rule set and `scripts/lint.sh` is the single entry point. OPE-213
# added type resolution: `build.gradle.kts` applies detekt to every subproject
# so the per-compilation tasks carry a classpath, and `scripts/lint.sh` runs the
# `detektAll` aggregate over the portable root scan plus those typed tasks.
# Because type resolution needs the compiled classes, this job now compiles the
# Android/Kotlin modules before linting. The detekt configuration and its CI job
# ship together (both live on PR #20).
#
# Toolchain policy (repo Actions allowlist): the organization permits only
# `actions/checkout@*`; every other marketplace action is rejected with
# `startup_failure` before the job starts. This workflow therefore uses ONLY
# `actions/checkout` plus plain shell steps, and relies on the toolchain that is
# already installed on the runner.
#
# Runner policy (docs/CI-RUNNER-STRATEGY.md §2): JDK 21 + Gradle work runs on
# the company self-hosted pool, not GitHub-hosted runners. The step sources
# scripts/ci/runner-toolchain-env.sh (OPE-98) to resolve JAVA_HOME. The Gradle
# distribution and every dependency stay pinned in the repo
# (gradle/wrapper/gradle-wrapper.properties, gradle/libs.versions.toml), so the
# runner is a cache, not a source of truth.
#
# The `pull_request` trigger is path-filtered (OPE-250, Phase 1) to source and
# lint-config inputs. `lint` is NOT in `required_status_checks` (only
# `T4 static scan` is), so a skipped run cannot leave an "Expected" check; see
# docs/BRANCH-PROTECTION.md.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "config/detekt/**"
      - "scripts/lint.sh"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "config/detekt/**"
      - "scripts/lint.sh"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, hostinger]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run detekt lint gate
        run: |
          set -euo pipefail
          . scripts/ci/runner-toolchain-env.sh
          chmod +x gradlew
          java -version
          CI=1 bash scripts/lint.sh
      # upload-artifact is not on the Actions allowlist, so inline the reports
      # into the job log on every run to keep failures actionable. Type-resolved
      # tasks write one report per compilation under build/reports/detekt/<module>.
      - name: Publish detekt report to the job log
        if: always()
        run: |
          set -euo pipefail
          report_dir=build/reports/detekt
          if [ ! -d "$report_dir" ]; then
            echo "no detekt report directory was produced"
            exit 0
          fi
          # Only the text and markdown reports are inlined; the xml/html/sarif
          # reports stay on the runner.
          while IFS= read -r f; do
            echo "----- $f -----"
            cat "$f"
          done < <(find "$report_dir" -type f \( -name '*.txt' -o -name '*.md' \) | sort)
