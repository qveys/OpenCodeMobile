name: Lint

# OPE-15 — required `lint` gate. Runs on every push to `main` and every PR to
# `main`, and fails the build on any detekt finding.
#
# The gate itself is configured by OPE-14: `config/detekt/detekt.yml` holds the
# bug-focused rule set, `build.gradle.kts` applies detekt once at the root over
# every `.kt` source, and `scripts/lint.sh` is the single entry point that runs
# `./gradlew detekt`. This workflow only wires that entry point into CI, so the
# detekt configuration and its CI job ship together (both live on PR #20).
#
# Toolchain policy (repo Actions allowlist): the organization permits only
# `actions/checkout@*`; every other marketplace action is rejected with
# `startup_failure` before the job starts. This workflow therefore uses ONLY
# `actions/checkout` plus plain shell steps, and relies on the toolchain that is
# already installed on the runner.
#
# Runner policy (docs/CI-RUNNER-STRATEGY.md §2): JDK 21 + Gradle work runs on
# the company self-hosted pool, not GitHub-hosted runners. The step sources
# scripts/ci/runner-toolchain-env.sh (OPE-98) to resolve JAVA_HOME. The Gradle
# distribution and every dependency stay pinned in the repo
# (gradle/wrapper/gradle-wrapper.properties, gradle/libs.versions.toml), so the
# runner is a cache, not a source of truth.
#
# The `pull_request` trigger is intentionally NOT path-filtered. A path-filtered
# workflow produces no status when a PR touches none of its paths, which would
# leave the required `lint` check permanently "Expected" and block every PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, hostinger]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run detekt lint gate
        run: |
          set -euo pipefail
          . scripts/ci/runner-toolchain-env.sh
          chmod +x gradlew
          java -version
          CI=1 bash scripts/lint.sh
      # upload-artifact is not on the Actions allowlist, so inline the report
      # into the job log on every run to keep failures actionable.
      - name: Publish detekt report to the job log
        if: always()
        run: |
          set -euo pipefail
          report_dir=build/reports/detekt
          if [ ! -d "$report_dir" ]; then
            echo "no detekt report directory was produced"
            exit 0
          fi
          ls -la "$report_dir"
          for f in "$report_dir/detekt.txt" "$report_dir/detekt.md"; do
            if [ -f "$f" ]; then
              echo "----- $f -----"
              cat "$f"
            fi
          done

  # -------------------------------------------------------------------------
  # OPE-220 — TEMPORARY. Removed again before PR #24 is final.
  #
  # Regenerating gradle/verification-metadata.xml correctly needs a machine that
  # can reach BOTH Maven Central and the Gradle Plugin Portal: the Portal serves
  # different bytes than Central for some plugin marker POMs, so regenerating
  # from Central alone silently corrupts those pins.
  #
  # The agent environment cannot reach plugins.gradle.org. This job runs the
  # prescribed `--write-verification-metadata` command on the self-hosted runner,
  # which can, and prints the resulting diff to the log for review.
  #
  # It is gated so it never runs on a push to the default branch. The `lint` gate
  # above is untouched. The job holds read-only
  # permissions and never commits anything.
  regen-verification-metadata:
    name: regen verification metadata (OPE-220)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, hostinger]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Regenerate detekt checksums
        run: |
          set -euo pipefail
          . scripts/ci/runner-toolchain-env.sh
          chmod +x gradlew
          java -version
          # The self-hosted runner checks the tree out as a different user, so
          # git refuses to read it without this exception.
          git config --global --add safe.directory '*'
          echo "OPE220-REGEN-HEAD=$(git rev-parse HEAD)"
          echo "OPE220-REGEN-BEFORE=$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)"
          # --configure-on-demand keeps Gradle to the root project, where the
          # detekt plugin is declared.
          ./gradlew --configure-on-demand --no-daemon --console=plain \
            --write-verification-metadata sha256 detekt help || true
      - name: Publish the verification-metadata diff
        if: always()
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          echo "OPE220-REGEN-AFTER=$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)"
          echo "===== OPE220-BEGIN-DETECT-LINES ====="
          grep -n -A3 'io.gitlab.arturbosch.detekt.gradle.plugin' \
            gradle/verification-metadata.xml || echo "(no detekt marker entry)"
          echo "===== OPE220-END-DETECT-LINES ====="
          echo "===== OPE220-BEGIN-DIFF ====="
          git --no-pager diff --stat -- gradle/verification-metadata.xml || true
          git --no-pager diff -- gradle/verification-metadata.xml || true
          echo "===== OPE220-END-DIFF ====="
