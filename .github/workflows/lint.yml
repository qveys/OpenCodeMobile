name: Lint

# OPE-15 — required `lint` gate. Runs on every push to `main` and every PR to
# `main`, and fails the build on any detekt finding.
#
# The gate itself is configured by OPE-14: `config/detekt/detekt.yml` holds the
# bug-focused rule set and `scripts/lint.sh` is the single entry point. OPE-213
# added type resolution: `build.gradle.kts` applies detekt to every subproject
# so the per-compilation tasks carry a classpath, and `scripts/lint.sh` runs the
# `detektAll` aggregate over the portable root scan plus those typed tasks.
# Because type resolution needs the compiled classes, this job now compiles the
# Android/Kotlin modules before linting. The detekt configuration and its CI job
# ship together (both live on PR #20).
#
# Toolchain policy (repo Actions allowlist): the organization permits only
# `actions/checkout@*`; every other marketplace action is rejected with
# `startup_failure` before the job starts. This workflow therefore uses ONLY
# `actions/checkout` plus plain shell steps.
#
# Runner policy (docs/CI-RUNNER-STRATEGY.md §2, OPE-212): JDK 21 + Gradle work
# runs on the company self-hosted pool, not GitHub-hosted runners, and since
# OPE-212 it runs inside a throwaway, non-root container
# (docs/adr/0007-ephemeral-nonroot-hostinger-jobs.md). The image is pinned by
# digest and carries JDK 21, so the job no longer depends on the host toolchain:
# fresh filesystem per job, no shared state, build as uid 10001. The Gradle
# distribution and every dependency stay pinned in the repo
# (gradle/wrapper/gradle-wrapper.properties, gradle/libs.versions.toml), so the
# container is a cache, not a source of truth.
#
# The `pull_request` trigger is path-filtered (OPE-250, Phase 1) to source and
# lint-config inputs. `lint` is NOT in `required_status_checks` (only
# `T4 static scan` is), so a skipped run cannot leave an "Expected" check; see
# docs/BRANCH-PROTECTION.md.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "config/detekt/**"
      - "scripts/lint.sh"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "config/detekt/**"
      - "scripts/lint.sh"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Container jobs default to `sh`; every step here uses bash.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, hostinger]
    timeout-minutes: 45
    # OPE-212 — ephemeral, non-root isolation. Digest-pinned JDK 21 image; the
    # job gets a fresh filesystem and builds as uid 10001.
    container:
      image: eclipse-temurin@sha256:6adefddd4a20bceef702cedb0b03952fcd7691f9c7ccffe27014992abc0b46bd
      # OPE-254 — type-resolved detekt compiles the Android/KMP modules, so the
      # job needs the Android SDK. The OPE-98 host toolchain lives at
      # /opt/android-sdk on the hostinger runners; mount it read-only so the
      # container stays ephemeral and non-root while `runner-toolchain-env.sh`
      # can export ANDROID_HOME. Read-only keeps the host SDK out of reach for
      # writes. Reviewed by Security/DevOps in OPE-254.
      #
      # OPE-259: this is the ONLY host toolchain a `container:` job in this
      # repository mounts, and it narrows ADR 0007's "no host toolchain or
      # cache volume" claim by one read-only path. The runner itself already
      # bind-mounts its workspace, temp, action-cache paths and
      # /var/run/docker.sock into EVERY container job; those are outside the
      # isolation claim and are enumerated in docs/adr/0007 and
      # docs/CI-RUNNER-STRATEGY.md §7.1.
      #
      # OPE-259 fail-fast: `docker -v /opt/android-sdk:/opt/android-sdk:ro`
      # CREATES an empty root-owned directory on the host when the path does
      # not exist, so an unprovisioned runner used to fail much later with
      # `SDK location not found` and looked like a detekt/type-resolution bug.
      # The step below asserts the platform directory before the build starts.
      volumes:
        - /opt/android-sdk:/opt/android-sdk:ro
      options: --user 0:0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run detekt lint gate
        run: |
          bash scripts/ci/run-as-nonroot.sh env CI=1 bash -c '
            set -euo pipefail
            . scripts/ci/runner-toolchain-env.sh
            test -d "$ANDROID_HOME/platforms/android-35" \
              || { echo "::error::host Android SDK missing at $ANDROID_HOME on $RUNNER_NAME — run the \"Provision runner toolchain\" workflow on this host"; exit 1; }
            chmod +x gradlew
            java -version
            bash scripts/lint.sh
          '
      # upload-artifact is not on the Actions allowlist, so inline the reports
      # into the job log on every run to keep failures actionable. Type-resolved
      # tasks write one report per compilation under build/reports/detekt/<module>.
      - name: Publish detekt report to the job log
        if: always()
        run: |
          set -euo pipefail
          report_dir=build/reports/detekt
          if [ ! -d "$report_dir" ]; then
            echo "no detekt report directory was produced"
            exit 0
          fi
          # Only the text and markdown reports are inlined; the xml/html/sarif
          # reports stay on the runner.
          while IFS= read -r f; do
            echo "----- $f -----"
            cat "$f"
          done < <(find "$report_dir" -type f \( -name '*.txt' -o -name '*.md' \) | sort)
