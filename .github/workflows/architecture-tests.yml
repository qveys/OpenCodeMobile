name: Architecture Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'features/**'
      - 'design-system/**'
      - 'androidApp/**'
      - 'architecture-tests/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'features/**'
      - 'design-system/**'
      - 'androidApp/**'
      - 'architecture-tests/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'

permissions:
  contents: read

jobs:
  architecture-tests:
    name: Architecture / Dependency Rule Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run architecture tests
        run: ./gradlew :architecture-tests:test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-test-reports
          path: architecture-tests/build/reports/tests/
          retention-days: 7