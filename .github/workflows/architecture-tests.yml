name: Architecture Tests

# Repo Actions allowlist: only `actions/checkout@*` may run; every other action
# is rejected by the org policy with `startup_failure` before the job starts
# (same constraint documented in build.yml and security-logging.yml on main).
# This workflow therefore uses ONLY `actions/checkout` and relies on the JDK /
# Gradle preinstalled on GitHub-hosted runners.

on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'features/**'
      - 'design-system/**'
      - 'androidApp/**'
      - 'architecture-tests/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'features/**'
      - 'design-system/**'
      - 'androidApp/**'
      - 'architecture-tests/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'

permissions:
  contents: read

jobs:
  architecture-tests:
    name: Architecture / Dependency Rule Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run architecture tests
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          chmod +x gradlew
          java -version
          ./gradlew :architecture-tests:test --no-daemon --stacktrace