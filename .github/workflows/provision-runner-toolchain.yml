name: Provision runner toolchain

# OPE-98 — install JDK 21 + Android SDK on the company self-hosted runners.
#
# The repo Actions allowlist permits only `actions/checkout@*`, so
# `actions/setup-java` / `gradle/actions/setup-gradle` /
# `android-actions/setup-android` cannot provision the runners. This workflow
# runs a plain shell script *on the runner* (the only channel we have to the
# persistent runner machines) and then proves the toolchain works with the
# acceptance command from OPE-98:
#
#   ./gradlew :shared:networking:testDebugUnitTest --no-daemon
#
# It is idempotent and safe to re-run at any time. Provisioning is restricted to
# `main`: this workflow runs repo-controlled shell on persistent company
# machines, so a feature branch must not trigger it. `push` is scoped to `main`
# and path-filtered; `workflow_dispatch` on any other ref is skipped by the job
# guard.
#
# The shared `hostinger` label matches two Linux runners (vps-dokploy /
# vps-openclaw), so a single job on it provisions only whichever host picks it
# up. The Linux job is a matrix keyed on each runner's unique label.
#
# After this workflow is green, ordinary CI jobs only need to source
# `scripts/ci/runner-toolchain-env.sh` (see .github/workflows/security-logging.yml).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-runner-toolchain.yml'
      - 'scripts/ci/**'

concurrency:
  # One provisioning run repository-wide. Queue, never cancel: cancelling a job
  # mid-install can leave a runner half provisioned. Automatic runs are scoped to
  # `main`, so the pile-up no longer comes from feature branches.
  group: provision-runner-toolchain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision-linux:
    name: Provision Linux runner (${{ matrix.runner }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        runner: [vps-dokploy, vps-openclaw]
    runs-on: [self-hosted, '${{ matrix.runner }}']
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Provision JDK 21 + Android SDK
        run: bash scripts/ci/provision-runner-toolchain.sh
      - name: Acceptance — toolchain paths resolve
        run: |
          set -euo pipefail
          . scripts/ci/runner-toolchain-env.sh
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          java -version
      - name: Acceptance — gradle unit tests
        run: bash scripts/ci/run-toolchain-acceptance.sh

  provision-mac:
    name: Provision macOS runner
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, mac]
    # The mac runner's measured download throughput is ~35 KB/s, so a 203 MB JDK
    # plus the Android SDK can take ~2-3 h. The provisioning script bounds each
    # phase itself; this timeout only backstops a fully wedged runner.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Provision JDK 21 + Android SDK
        run: bash scripts/ci/provision-runner-toolchain.sh
      - name: Acceptance — toolchain paths resolve
        run: |
          set -euo pipefail
          . scripts/ci/runner-toolchain-env.sh
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          java -version
          if [ -x /usr/libexec/java_home ]; then /usr/libexec/java_home -v 21; fi
      - name: Acceptance — gradle unit tests
        run: bash scripts/ci/run-toolchain-acceptance.sh
