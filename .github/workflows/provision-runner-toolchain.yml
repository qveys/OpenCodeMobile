name: Provision runner toolchain

# OPE-98 — install JDK 21 + Android SDK on the macOS self-hosted runner.
# Linux toolchain consumers now use digest-pinned CI images (OPE-314), so this
# workflow retains only macOS provisioning for Xcode/Kotlin-Native jobs.
#
# The repo Actions allowlist permits only `actions/checkout@*`, so
# `actions/setup-java` / `gradle/actions/setup-gradle` /
# `android-actions/setup-android` cannot provision the runners. This workflow
# runs a plain shell script *on the runner* (the only channel we have to the
# persistent runner machines) and then proves the toolchain works with the
# acceptance command from OPE-98:
#
#   ./gradlew :shared:networking:testDebugUnitTest --no-daemon
#
# It is idempotent and safe to re-run at any time. `workflow_dispatch` forces a
# refresh; the `push` trigger is path-filtered to the provisioning files so
# ordinary pushes do not re-run it.
#
# Linux Gradle jobs use the repository-built Android CI image. macOS jobs still
# source `scripts/ci/runner-toolchain-env.sh` for the provisioned JDK.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-runner-toolchain.yml'
      - 'scripts/ci/provision-runner-toolchain.sh'
      - 'scripts/ci/runner-toolchain-env.sh'
      - 'scripts/ci/run-toolchain-acceptance.sh'

concurrency:
  # Isolated per-ref group: on the slow mac runner a provisioning run takes
  # 2-3 h, and a repo-wide group let any other branch's push cancel this
  # branch's run within seconds (observed 2026-09-29). OPE-98 owns the
  # repository-wide supersession policy; this branch stays uncancellable so it
  # can actually finish and verify the fix.
  group: provision-runner-toolchain-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision-mac:
    name: Provision macOS runner
    runs-on: [self-hosted, mac]
    # The mac runner's measured download throughput is ~35 KB/s, so a 203 MB JDK
    # plus the Android SDK can take ~2-3 h. The provisioning script bounds each
    # phase itself; this timeout only backstops a fully wedged runner.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Provision JDK 21 + Android SDK
        run: bash scripts/ci/provision-runner-toolchain.sh
      - name: Acceptance — toolchain paths resolve
        run: |
          set -euo pipefail
          . scripts/ci/runner-toolchain-env.sh
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          java -version
          if [ -x /usr/libexec/java_home ]; then /usr/libexec/java_home -v 21; fi
      - name: Acceptance — gradle unit tests
        run: bash scripts/ci/run-toolchain-acceptance.sh
