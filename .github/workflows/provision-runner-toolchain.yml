name: Provision runner toolchain

# OPE-98 — install JDK 21 + Android SDK on the company self-hosted runners.
#
# The repo Actions allowlist permits only `actions/checkout@*`, so
# `actions/setup-java` / `gradle/actions/setup-gradle` /
# `android-actions/setup-android` cannot provision the runners. This workflow
# runs a plain shell script *on the runner* (the only channel we have to the
# persistent runner machines) and then proves the toolchain works with the
# acceptance command from OPE-98:
#
#   ./gradlew :shared:networking:testDebugUnitTest --no-daemon
#
# It is idempotent and safe to re-run at any time. `workflow_dispatch` forces a
# refresh; the `push` trigger is path-filtered to the provisioning script and its
# helpers so ordinary pushes do not re-run it.
#
# After this workflow is green, ordinary CI jobs only need to source
# `scripts/ci/runner-toolchain-env.sh` (see .github/workflows/security-logging.yml).

on:
  workflow_dispatch:
  push:
    paths:
      # The provisioning script and its helpers. This workflow file is
      # deliberately NOT listed: editing the workflow itself must not force a
      # provisioning run, so control-plane edits cannot self-trigger a job on
      # the single shared macOS runner.
      - 'scripts/ci/**'

concurrency:
  # At most one provisioning run repository-wide, and a newer provisioning
  # change supersedes older pending/in-progress runs instead of queueing behind
  # them. Without this, several branches touching scripts/ci/** each enqueue a
  # provisioning job that piles up on the single `macbook-openclaw` runner
  # (observed 2026-09-29: one stuck job blocked three later runs for hours).
  # Provisioning is idempotent, so cancelling a superseded run is safe: the
  # newer run re-installs/reuses the same pinned toolchain.
  group: provision-runner-toolchain
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  provision-linux:
    name: Provision Linux runner (hostinger)
    runs-on: [self-hosted, hostinger]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Provision JDK 21 + Android SDK
        run: bash scripts/ci/provision-runner-toolchain.sh
      - name: Acceptance — toolchain paths resolve
        run: |
          set -euo pipefail
          . scripts/ci/runner-toolchain-env.sh
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          java -version
      - name: Acceptance — gradle unit tests
        run: bash scripts/ci/run-toolchain-acceptance.sh

  provision-mac:
    name: Provision macOS runner
    runs-on: [self-hosted, mac]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Provision JDK 21 + Android SDK
        run: bash scripts/ci/provision-runner-toolchain.sh
      - name: Acceptance — toolchain paths resolve
        run: |
          set -euo pipefail
          . scripts/ci/runner-toolchain-env.sh
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          java -version
          if [ -x /usr/libexec/java_home ]; then /usr/libexec/java_home -v 21; fi
      - name: Acceptance — gradle unit tests
        run: bash scripts/ci/run-toolchain-acceptance.sh
