name: Logging Redaction (T4)

# OPE-27 / OPE-56 / threat T4 — required gate: no PR may merge while the adapter
# or the generated OpenAPI client can log a server credential or prompt body.
#
# Repo Actions allowlist: only `actions/checkout@*` may run; every other action
# (`actions/setup-java`, `gradle/actions/setup-gradle`, `android-actions/setup-android`,
# `actions/upload-artifact`) is rejected by the org policy with `startup_failure`
# before the job starts (same constraint documented in build.yml). This workflow
# therefore uses ONLY `actions/checkout`.
#
# Runner policy: jobs run on the company self-hosted runner pool, not on
# GitHub-hosted runners. Both jobs now run on the Linux hostinger VPS
# (`[self-hosted, hostinger]` -> vps-dokploy / vps-openclaw). The redaction
# tests are a plain JVM/Android unit test and no longer need the single-lane
# `mac` runner (OPE-250, Phase 0.1); the hostinger pool is provisioned with
# JDK 21 + the Android SDK by `.github/workflows/provision-runner-toolchain.yml`
# (OPE-98) and resolved at job time through
# `scripts/ci/runner-toolchain-env.sh`. See `docs/CI-RUNNER-STRATEGY.md`.
#
# The `pull_request` trigger is intentionally NOT path-filtered. A path-filtered
# workflow produces no status when a PR touches none of its paths, which would
# leave a required check permanently "Expected" and block every PR. Running the
# fast static scan on every PR keeps the required "T4 static scan" check always
# reportable.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-logging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Container jobs default to `sh`; every step here uses bash.
defaults:
  run:
    shell: bash

jobs:
  static-scan:
    name: T4 static scan
    # OPE-291 (review @qveys): every event runs on the company hostinger
    # pool — no GitHub-hosted minutes. Isolation relies on the digest-pinned
    # image running as uid 10001 (ADR 0007); the OPE-258 routing reservation
    # is superseded.
    runs-on: [self-hosted, hostinger]
    timeout-minutes: 5
    # OPE-212 — ephemeral, non-root isolation. The image is pinned by digest
    # (eclipse-temurin 21-jdk-jammy); the job gets a fresh filesystem and runs
    # the scan as uid 10001. See
    # docs/adr/0007-ephemeral-nonroot-hostinger-jobs.md.
    container:
      image: eclipse-temurin@sha256:6adefddd4a20bceef702cedb0b03952fcd7691f9c7ccffe27014992abc0b46bd
      options: --user 0:0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan for unredacted secret logging
        run: |
          # OPE-258 — the uid-10001 wrapper exists to cross the root-owned
          # self-hosted `_work` mount. On the ephemeral GitHub-hosted runner
          # there is no shared host and no host Docker socket, and chowning the
          # runner temp breaks the checkout post-step, so run the scan directly.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            bash scripts/check-no-secret-logging.sh
          else
            bash scripts/ci/run-as-nonroot.sh bash scripts/check-no-secret-logging.sh
          fi
      # These three supply-chain gates run directly, not through
      # scripts/ci/run-as-nonroot.sh like the scan above. SEC-05 needs an
      # interpreter to verify the distributionUrl publisher and parse
      # verification-metadata.xml, and it is only on the PATH that su(1) hands to
      # uid 10001. Wrapping it made SEC-05 fail closed on a missing interpreter
      # rather than on a real integrity problem. The gates read the checkout and
      # change nothing.
      - name: Require SHA-pinned GitHub Actions (SEC-04)
        run: bash scripts/check-workflow-action-pinning.sh
      - name: Require an integrity-pinned Gradle toolchain (SEC-05)
        run: |
          set -euo pipefail
          # main sets `defaults.run.shell: bash` for these container jobs, which
          # GitHub runs as `bash --noprofile --norc`. Skipping the profile also
          # skips the PATH that carries the interpreter this gate needs, so the
          # gate stopped on "python3 is not on PATH" instead of on an integrity
          # problem. Restore the standard locations, then report which
          # interpreter the gate is about to use so a real failure stays legible.
          #
          # The interpreter is perl, not python3: OPE-257 moved SEC-05 off python3
          # and OPE-264 moved SEC-05b, because this digest-pinned image carries
          # neither python3 nor PerlIO — only perl-base. Both gates parse with
          # scripts/lib/, and both fail closed when the interpreter or the library
          # is missing.
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          echo "SEC-05 parser: $(command -v perl || echo NONE)"
          bash scripts/check-gradle-supply-chain.sh
      # SEC-05b (OPE-238). SEC-05 proves gradle/verification-metadata.xml exists
      # and pins something; it cannot prove the pins cover what the build
      # resolves. OPE-220 is that gap: `main` added a dependency, the pin file
      # was never regenerated, and every job went red at once during plugin
      # resolution. This step fails a pull request that changes a build input
      # without the pins catching up, and refuses any workflow that lets CI
      # rewrite the pins from an unreviewed environment. See
      # docs/CI-CD-SECURITY.md §8 — this comment deliberately does not spell
      # out the regeneration flag, because the gate matches the flag anywhere
      # in a workflow file, comments included, so a commented-out regeneration
      # step cannot be left waiting to be re-enabled.
      #
      # OPE-264 moved this gate off python3, which this digest-pinned image does
      # not carry, onto the perl parsers in scripts/lib/ that SEC-05 already
      # uses. The image and this job's permissions are unchanged: the digest pin is
      # the supply-chain control and the container is OPE-212's isolation.
      - name: Require dependency pins to cover the declared build inputs (SEC-05b)
        run: bash scripts/check-verification-metadata-coverage.sh

  redaction-tests:
    name: Redaction unit tests
    # OPE-291 (review @qveys): every event runs on the company hostinger
    # pool — no GitHub-hosted minutes. Isolation relies on the digest-pinned
    # GHCR image running as uid 10001 (ADR 0007); the OPE-258/OPE-265 routing
    # reservation is superseded.
    # OPE-250 (Phase 0.1) moved this off the single-lane `mac` runner to
    # `hostinger`: the job is a plain `:shared:networking:testDebugUnitTest`
    # that only needs JDK 21 + the Android SDK, both provisioned on hostinger
    # (OPE-98/OPE-100). On `mac` a 44-second test queued ~43 minutes behind the
    # long iOS jobs.
    #
    # OPE-255 (ADR 0007 stage 2): it now gets JDK 21 + Android SDK 35 from the
    # digest-pinned repository CI image instead of the host toolchain, and runs
    # as uid 10001. This preserves the T4 supply-chain policy: the toolchain is
    # a reviewed, digest-pinned image, not an unverified per-run download.
    runs-on: [self-hosted, hostinger]
    needs: static-scan
    timeout-minutes: 40
    container:
      image: ghcr.io/qveys/opencodemobile/ci-android@sha256:83077870201bbe6f8a4843da2c003b84db3e849236cb2cd71707ee639e6d18ab
      options: --user 0:0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run networking redaction tests
        run: bash scripts/ci/run-as-nonroot.sh bash -c 'set -euo pipefail; chmod +x gradlew; java -version; ./gradlew :shared:networking:testDebugUnitTest --no-daemon --stacktrace'