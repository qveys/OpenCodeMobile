name: Logging Redaction (T4)

# OPE-27 / OPE-56 / threat T4 — required gate: no PR may merge while the adapter
# or the generated OpenAPI client can log a server credential or prompt body.
#
# Repo Actions allowlist: only `actions/checkout@*` may run; every other action
# (`actions/setup-java`, `gradle/actions/setup-gradle`, `android-actions/setup-android`,
# `actions/upload-artifact`) is rejected by the org policy with `startup_failure`
# before the job starts (same constraint documented in build.yml). This workflow
# therefore uses ONLY `actions/checkout`.
#
# Runner policy: jobs run on the company self-hosted runner pool, not on
# GitHub-hosted runners. The lightweight static scan runs on the Linux hostinger
# VPS (`[self-hosted, hostinger]` -> vps-dokploy / vps-openclaw). The Gradle /
# Android redaction tests target the macOS runner (`[self-hosted, mac]` ->
# macbook-openclaw); its JDK 21 + Android SDK toolchain is provisioned by
# `.github/workflows/provision-runner-toolchain.yml` (OPE-98) and resolved at
# job time through `scripts/ci/runner-toolchain-env.sh`. See
# `docs/CI-RUNNER-STRATEGY.md`. Until that provisioning is green the job stays
# disabled on pull_request (see the job-level comment).
#
# The `pull_request` trigger is intentionally NOT path-filtered. A path-filtered
# workflow produces no status when a PR touches none of its paths, which would
# leave a required check permanently "Expected" and block every PR. Running the
# fast static scan on every PR keeps the required "T4 static scan" check always
# reportable.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-logging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-scan:
    name: T4 static scan
    # The job name is the required status check on `main`; do not rename it or
    # every pull request would be left permanently "Expected" and blocked.
    #
    # This job is also the required gate for the SEC-04 / SEC-05 / SEC-05b
    # supply-chain controls. They run here rather than in a new job so that no
    # branch protection change is needed to make them blocking — a new job name
    # would not be a required check until branch protection is edited, and the
    # gates would be advisory only in the meantime.
    runs-on: [self-hosted, hostinger]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan for unredacted secret logging
        run: bash scripts/check-no-secret-logging.sh
      - name: Require SHA-pinned GitHub Actions (SEC-04)
        run: bash scripts/check-workflow-action-pinning.sh
      - name: Require an integrity-pinned Gradle toolchain (SEC-05)
        run: bash scripts/check-gradle-supply-chain.sh
      # SEC-05b (OPE-238). SEC-05 proves gradle/verification-metadata.xml exists
      # and pins something; it cannot prove the pins cover what the build
      # resolves. OPE-220 is that gap: `main` added a dependency, the pin file
      # was never regenerated, and every job went red at once during plugin
      # resolution. This step fails a pull request that changes a build input
      # without the pins catching up, and refuses any workflow that lets CI
      # rewrite the pins from an unreviewed environment. See
      # docs/CI-CD-SECURITY.md §8 — this comment deliberately does not spell
      # out the regeneration flag, because the gate matches the flag anywhere
      # in a workflow file, comments included, so a commented-out regeneration
      # step cannot be left waiting to be re-enabled.
      - name: Require dependency pins to cover the declared build inputs (SEC-05b)
        run: bash scripts/check-verification-metadata-coverage.sh

  redaction-tests:
    name: Redaction unit tests
    # TEMPORARILY MANUAL ONLY. This job needs a JDK 21 + Android SDK toolchain.
    # The self-hosted runner pool (hostinger / mac) has no Java runtime yet, and
    # the repository Actions allowlist permits only `actions/checkout@*`, so the
    # toolchain cannot be installed by an action. Downloading a JDK/Android SDK
    # inside a security gate would add an unverified supply-chain step, so the
    # job is disabled on pull_request/push instead. OPE-98 provisions the
    # runners; re-enable the pull_request trigger once Java + Android SDK are
    # present. It stays runnable by hand: Actions -> Logging Redaction (T4) ->
    # Run workflow.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, mac]
    needs: static-scan
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run networking redaction tests
        run: |
          set -euo pipefail
          . scripts/ci/runner-toolchain-env.sh
          chmod +x gradlew
          java -version
          ./gradlew :shared:networking:testDebugUnitTest --no-daemon --stacktrace