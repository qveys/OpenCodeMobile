name: Logging Redaction (T4)

# OPE-27 / threat T4 — required gate: no PR may merge while the adapter or the
# generated OpenAPI client can log a server credential or prompt body.
on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/networking/**'
      - 'shared/data/**'
      - 'scripts/check-no-secret-logging.sh'
      - '.github/workflows/security-logging.yml'
  push:
    branches: [main]
    paths:
      - 'shared/networking/**'
      - 'shared/data/**'
      - 'scripts/check-no-secret-logging.sh'
      - '.github/workflows/security-logging.yml'

concurrency:
  group: security-logging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-scan:
    name: Static — no secret-bearing log fields
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan for unredacted secret logging
        run: bash scripts/check-no-secret-logging.sh

  redaction-tests:
    name: Redaction unit tests
    runs-on: ubuntu-latest
    needs: static-scan
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Run networking redaction tests
        run: ./gradlew :shared:networking:testDebugUnitTest --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redaction-test-reports
          path: shared/networking/build/reports/tests/
          retention-days: 7