name: Build

# OPE-18 — Build step (jobs: build-android, build-ios).
# OPE-17 — Test step (jobs: test-android, test-ios, further down).
#
# Compiles/bundles the application into deployable artifacts for BOTH target
# families from the SAME revision (one workflow run => one github.sha):
#   - Android: debug + release APK and release AAB via
#     :androidApp:assemble{Debug,Release} + :androidApp:bundleRelease
#   - Apple (iOS/macOS host): Kotlin/Native framework link for iosSimulatorArm64
#     and iosArm64
#
# Toolchain policy (repo Actions allowlist):
#   The organization allows only `actions/checkout@*` to run. Every other
#   action (`actions/setup-java`, `gradle/actions/setup-gradle`,
#   `android-actions/setup-android`, `actions/upload-artifact`) is rejected with
#   `startup_failure` before the job starts. This workflow therefore uses ONLY
#   `actions/checkout` and relies on the JDK / Gradle / Android SDK / Xcode
#   installed on the company self-hosted pool: the build jobs run on the same
#   `[self-hosted, ...]` runners as the OPE-17 test jobs below (see
#   docs/CI-RUNNER-STRATEGY.md).
#   Reproducibility across environments
#   comes from the checked-in pinning instead:
#     - Gradle 8.10.2, pinned by gradle/wrapper/gradle-wrapper.properties
#     - Kotlin / AGP / Compose Multiplatform, pinned in gradle/libs.versions.toml
#     - JDK 21 / Android SDK: resolved per step by
#       scripts/ci/runner-toolchain-env.sh (OPE-98), so both jobs build with the
#       same provisioned major JDK.
#   If the allowlist is later widened to include `actions/upload-artifact`, add
#   an upload step for the paths listed under each job.
#
# OPE-250: the triggers are path-filtered to build inputs (module sources, Gradle
# files, CI scripts). A docs-only or UI-copy PR no longer compiles everything.

on:
  pull_request:
    branches: [main]
    # OPE-250 (Phase 1): condition the heavy build/test matrix on the files a PR
    # actually changes. This workflow is not a required status check, so a
    # skipped run never leaves a check "Expected".
    paths:
      - "androidApp/**"
      - "iosApp/**"
      - "iosAppHost/**"
      - "shared/**"
      - "features/**"
      - "design-system/**"
      - "tests/**"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "config/**"
      - "scripts/ci/**"
      - "scripts/test.sh"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "androidApp/**"
      - "iosApp/**"
      - "iosAppHost/**"
      - "shared/**"
      - "features/**"
      - "design-system/**"
      - "tests/**"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "config/**"
      - "scripts/ci/**"
      - "scripts/test.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android (APK/AAB)
    runs-on: [self-hosted, linux, hostinger]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assemble Android debug + release artifacts
        run: |
          set -euo pipefail
          . scripts/ci/runner-toolchain-env.sh
          chmod +x gradlew
          java -version
          ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease :androidApp:bundleRelease --no-daemon --stacktrace
      - name: Verify Android artifacts
        run: |
          set -euo pipefail
          echo "APK outputs:"
          find androidApp/build/outputs/apk -name '*.apk' -print -exec sha256sum {} \;
          echo "AAB outputs:"
          find androidApp/build/outputs/bundle -name '*.aab' -print -exec sha256sum {} \;
          test -n "$(find androidApp/build/outputs/apk -name '*.apk' -print -quit)"
          test -n "$(find androidApp/build/outputs/bundle -name '*.aab' -print -quit)"

  build-ios:
    name: Build iOS/macOS frameworks
    runs-on: [self-hosted, macOS, mac]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Link Kotlin/Native iOS frameworks
        run: |
          set -euo pipefail
          . scripts/ci/runner-toolchain-env.sh
          chmod +x gradlew
          java -version
          ./gradlew linkDebugFrameworkIosSimulatorArm64 linkDebugFrameworkIosArm64 \
            :iosAppHost:linkDebugFrameworkIosSimulatorArm64 :iosAppHost:linkDebugFrameworkIosArm64 \
            --no-daemon --stacktrace
      - name: Verify iOS frameworks
        run: |
          set -euo pipefail
          find . -path '*/build/bin/*/debugFramework/*.framework' -print | sort
          test -n "$(find . -path '*/build/bin/iosSimulatorArm64/debugFramework/*.framework' -print -quit)"
          test -n "$(find . -path '*/build/bin/iosArm64/debugFramework/*.framework' -print -quit)"
          test -n "$(find . -path '*/shared/security/build/bin/iosSimulatorArm64/debugFramework/*.framework' -print -quit)"
          test -n "$(find . -path '*/shared/domain/build/bin/iosSimulatorArm64/debugFramework/*.framework' -print -quit)"
          test -n "$(find . -path '*/iosAppHost/build/bin/iosSimulatorArm64/debugFramework/*.framework' -print -quit)"

  # OPE-17 — Test step. Runs the full KMP test suite from the SAME revision as
  # the build jobs above (one workflow run => one github.sha):
  #   - test-android: Android/JVM unit tests (`testDebugUnitTest`) on Linux.
  #   - test-ios: Apple Kotlin/Native simulator tests on macOS. Runs both
  #     `iosX64Test` and `iosSimulatorArm64Test`; Kotlin/Native skips the target
  #     that cannot run on the host, and the job fails if neither produced tests.
  #
  # Both jobs delegate the Gradle task list to scripts/test.sh (OPE-16), the
  # single test entry point. `--continue` makes every module report its failures
  # in one run instead of stopping at the first one, and the always-run
  # `Report test results` step inlines the failing tests (name, message, stack
  # trace) into the job log via scripts/ci/report-test-results.sh, because the
  # org Actions allowlist has no `actions/upload-artifact` to download reports.
  #
  # `test-ios` runs under scripts/ci/with-t1-tls-servers.sh: the iOS
  # `IosTlsHandshakePinningTest` dials a host-side TLS recorder
  # (`tests/t1/tls_recording_server.py`, ports 9943/9944) because Kotlin/Native
  # cannot build an in-process TLS server. Without those servers the full iOS
  # suite fails with "could not connect to the server".
  #
  # Runner policy (docs/CI-RUNNER-STRATEGY.md §2): untrusted `pull_request`
  # runs must not execute repo-controlled Gradle as uid 0 on the shared
  # hostinger VPS, so `test-android` routes its `pull_request` run to an
  # ephemeral GitHub-hosted runner and keeps the company pool for trusted
  # `push`/`workflow_dispatch` (OPE-265). `test-ios` stays on the company `mac`
  # pool, which is not shared with other repositories.
  #   - test-android -> ubuntu-latest (PR) / [self-hosted, hostinger] (push)
  #   - test-ios     -> [self-hosted, mac] (Xcode + JDK 21)
  # Each test step sources scripts/ci/runner-toolchain-env.sh (OPE-98) to
  # resolve JAVA_HOME / ANDROID_HOME; the allowlist permits only `actions/checkout`.
  test-android:
    name: Test Android (JVM unit tests)
    # OPE-265 — untrusted `pull_request` code must not reach the shared
    # hostinger pool: repo-controlled Gradle there executes as uid 0 on a host
    # that also owns a read-write Docker socket. The same non-container job
    # (JDK 21 + Android SDK only) runs on an ephemeral GitHub-hosted runner for
    # PRs; trusted push/workflow_dispatch keep the company pool.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","hostinger"]') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run Android/JVM unit tests
        run: |
          set -euo pipefail
          # OPE-265 — on the GitHub-hosted runner the JDK 21 toolchain is
          # preinstalled as $JAVA_HOME_21_X64; on the self-hosted pool
          # runner-toolchain-env.sh resolves it from the OPE-98 provision.
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then
            export JAVA_HOME="$JAVA_HOME_21_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          . scripts/ci/runner-toolchain-env.sh
          chmod +x gradlew
          java -version
          CI=1 bash scripts/test.sh android -- --continue
      - name: Report test results
        if: always()
        run: bash scripts/ci/report-test-results.sh

  test-ios:
    name: Test iOS simulator (Kotlin/Native)
    runs-on: [self-hosted, mac]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run iOS simulator tests
        run: |
          set -euo pipefail
          . scripts/ci/runner-toolchain-env.sh
          chmod +x gradlew
          java -version
          CI=1 bash scripts/ci/with-t1-tls-servers.sh bash scripts/test.sh apple -- --continue
      - name: Report test results
        if: always()
        run: bash scripts/ci/report-test-results.sh
