name: T1 device validation

# OPE-94 — real-device/simulator TLS handshake validation for T1 pinning.
#
# Exercises the fail-closed server-identity check end to end over a real TLS
# handshake against a self-signed OpenCode server, on an Android emulator and
# an iOS simulator. This is the "verified on device" gap left after OPE-35:
# `commonTest` covers the decision logic with a fake verifier, this workflow
# runs the platform pinning engines (OkHttp `X509TrustManager`,
# `NSURLSession` challenge delegate) against a real handshake.
#
# Toolchain policy (repo Actions allowlist): only `actions/checkout@*` may run.
# The emulator and simulator are therefore provisioned from shell steps (see
# scripts/t1/), not from marketplace actions. If an emulator/simulator ever
# needs a widened allowlist, escalate to the repo admin (qveys) with the exact
# action and justification instead of bypassing the policy.
#
# No `actions/upload-artifact` is available, so each script prints its JUnit
# output and host-side TLS request logs into the job log.
#
# OPE-250: path-filtered to T1/security inputs; the emulator and simulator legs
# run off the PR path (`main`/nightly), and a new push cancels a superseded run.
on:
  pull_request:
    branches: [main]
    # OPE-250 (Phase 1): only run when a T1/security input changes. Not a
    # required status check, so a skipped run cannot leave a check "Expected".
    paths:
      - "shared/security/**"
      - "shared/**"
      - "scripts/t1/**"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/t1-device-validation.yml"
  push:
    branches: [main]
    paths:
      - "shared/security/**"
      - "shared/**"
      - "scripts/t1/**"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/t1-device-validation.yml"
  schedule:
    # OPE-250 (Phase 0 / D2): the emulator and simulator legs no longer run on
    # pull requests, so validate them on a nightly schedule instead.
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  # OPE-250 (Phase 0.3): one group per ref so a new push cancels the in-flight
  # device validation. Device runs are long (emulator boot); keeping superseded
  # revisions alive only delays the current one.
  group: t1-device-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Container jobs default to `sh`; every step here uses bash.
defaults:
  run:
    shell: bash

jobs:
  jvm-handshake:
    name: T1 handshake (JVM)
    # OPE-255 (ADR 0007 stage 2): repository CI image (JDK 21 + Android SDK 35,
    # pinned by digest), run as uid 10001. See .github/workflows/ci-image.yml.
    runs-on: [self-hosted, hostinger]
    timeout-minutes: 20
    container:
      image: ghcr.io/qveys/opencodemobile/ci-android@sha256:83077870201bbe6f8a4843da2c003b84db3e849236cb2cd71707ee639e6d18ab
      options: --user 0:0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run T1 handshake unit tests
        run: bash scripts/ci/run-as-nonroot.sh bash -c 'set -euo pipefail; chmod +x gradlew; java -version; ./gradlew :shared:security:testDebugUnitTest --no-daemon --stacktrace'

  android-instrumented-compile:
    name: T1 Android instrumented test compiles
    # OPE-255 (ADR 0007 stage 2): same repository CI image as jvm-handshake.
    runs-on: [self-hosted, hostinger]
    timeout-minutes: 25
    container:
      image: ghcr.io/qveys/opencodemobile/ci-android@sha256:83077870201bbe6f8a4843da2c003b84db3e849236cb2cd71707ee639e6d18ab
      options: --user 0:0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assemble Android instrumented test APK
        run: bash scripts/ci/run-as-nonroot.sh bash -c 'set -euo pipefail; chmod +x gradlew; ./gradlew :shared:security:assembleDebugAndroidTest --no-daemon --stacktrace'

  android-emulator:
    name: T1 handshake (Android emulator)
    # OPE-250 (D2): heavy device validation stays off the PR path; it runs on
    # `main` pushes, nightly, and manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Provision emulator and run instrumented T1 tests
        run: bash scripts/t1/run-android-device-validation.sh

  ios-simulator:
    name: T1 handshake (iOS simulator)
    # OPE-250 (D2): heavy device validation stays off the PR path; it runs on
    # `main` pushes, nightly, and manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run iOS simulator T1 tests against host TLS servers
        run: bash scripts/t1/run-ios-simulator-validation.sh